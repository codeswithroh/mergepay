# Reusable workflow: when a PR is merged, prove it to MergePay on Arc and pay the claimant.
#
# Who gets paid: the PR author (or, for a bot-authored PR, its human assignee), and only if that
# person holds the claim on the issue, i.e. is assigned to it (see claims.yml).
#
# Pin this file by tag or commit in the bounty (`job_workflow_ref`), so funders know exactly
# which logic decides who gets paid. It never checks out PR code, so running under
# pull_request_target is safe.
name: MergePay award

on:
  workflow_call:
    inputs:
      contract:
        description: MergePay contract address on Arc
        type: string
        required: true
      relayer:
        description: Relayer base URL (submits the proof and is reimbursed from the bounty)
        type: string
        required: true
      explorer:
        type: string
        default: https://explorer.arc.io

jobs:
  award:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: Find issues this PR closes
        id: issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"; name="${REPO##*/}"
          linked=$(gh api graphql \
            -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){closingIssuesReferences(first:20){nodes{number}}}}}' \
            -F o="$owner" -F r="$name" -F n="$PR" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' || true)
          # Keywords in the body too ("Fixes #12"), in case the link was made before the merge.
          keyword=$(printf '%s' "${BODY:-}" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' | grep -oE '[0-9]+' || true)
          issues=$(printf '%s\n%s\n' "$linked" "$keyword" | grep -E '^[0-9]+$' | sort -un | tr '\n' ' ')
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
          echo "Closes: ${issues:-none}"

      # Coding agents (Copilot, Claude, Devin, ...) often open PRs from a bot account. A bot can't
      # link a wallet, so for bot-authored PRs we pay the human the PR is assigned to: the person
      # who handed the issue to the agent. Assignees are read live, so a maintainer can fix the
      # assignment and re-run this job. Human-authored PRs always pay the author.
      - name: Decide who gets paid
        id: recipient
        if: steps.issues.outputs.issues != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          if [ "$AUTHOR_TYPE" != "Bot" ]; then
            printf 'id=%s\nlogin=%s\nvia=\n' "$AUTHOR_ID" "$AUTHOR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          human=$(gh api "repos/$REPO/pulls/$PR" --jq '[.assignees[] | select(.type == "User")][0] // empty | "\(.id) \(.login)"')
          if [ -z "$human" ]; then
            echo "::warning::PR opened by bot @$AUTHOR with no human assignee; not paying."
            gh pr comment "$PR" --repo "$REPO" --body "⏸️ **MergePay:** this PR was opened by @${AUTHOR}, a bot, so the bounty goes to the human it's assigned to, and nobody is assigned. Assign the person who handed this issue to the agent, then re-run the **MergePay** job on this PR."
            echo "id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'id=%s\nlogin=%s\nvia=%s\n' "${human%% *}" "${human#* }" "$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "Bot-authored PR: paying assignee @${human#* } (opened by @$AUTHOR)"

      - name: Prove merge and claim bounties
        if: steps.issues.outputs.issues != '' && steps.recipient.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ steps.issues.outputs.issues }}
          CONTRACT: ${{ inputs.contract }}
          RELAYER: ${{ inputs.relayer }}
          EXPLORER: ${{ inputs.explorer }}
          RECIPIENT_ID: ${{ steps.recipient.outputs.id }}
          RECIPIENT: ${{ steps.recipient.outputs.login }}
          VIA: ${{ steps.recipient.outputs.via }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          contract=$(printf '%s' "$CONTRACT" | tr 'A-F' 'a-f')
          by=""; [ -n "$VIA" ] && by=" (PR opened by @${VIA} on their behalf)"
          notes=""
          for issue in $ISSUES; do
            # Claims: a bounty pays only the person holding the issue (its human assignee) at merge time.
            # Unclaimed or claimed-by-someone-else issues are skipped and stay funded for the rightful claimant.
            holders=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq '[.assignees[] | select(.type == "User")]')
            if ! jq -e --argjson id "$RECIPIENT_ID" 'map(.id) | index($id) != null' <<<"$holders" >/dev/null; then
              names=$(jq -r 'map("@" + .login) | join(", ")' <<<"$holders")
              if [ -z "$names" ]; then
                notes="${notes}⏸️ #${issue} has a bounty but was never claimed, so it wasn't paid and stays open. If @${RECIPIENT} did the work, a maintainer can assign them to #${issue} and re-run this job."$'\n'
              else
                notes="${notes}⏸️ #${issue} is claimed by ${names}, not @${RECIPIENT}, so this merge wasn't paid for it."$'\n'
              fi
              continue
            fi
            aud="mergepay:${contract}:${issue}:${RECIPIENT_ID}"
            token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(jq -rn --arg a "$aud" '$a|@uri')" | jq -r .value)
            echo "::add-mask::$token"
            body=$(jq -n --arg t "$token" --argjson i "$issue" --argjson u "$RECIPIENT_ID" '{token:$t,issue:$i,userId:$u}')
            res=$(curl -sS -X POST "${RELAYER%/}/api/relay/award" -H 'content-type: application/json' -d "$body" || echo '{"ok":false,"error":"relayer unreachable"}')
            echo "#$issue -> $res"
            if [ "$(jq -r .ok <<<"$res")" = "true" ]; then
              tx=$(jq -r .txHash <<<"$res"); amount=$(jq -r .payout <<<"$res"); paid=$(jq -r .delivered <<<"$res")
              if [ "$paid" = "true" ]; then
                line="💸 **${amount} USDC** paid to @${RECIPIENT} for #${issue}${by} on Arc — [tx](${EXPLORER%/}/tx/${tx})"
              else
                line="🔒 **${amount} USDC** awarded to @${RECIPIENT} for #${issue}${by} — [tx](${EXPLORER%/}/tx/${tx}). Link a wallet within 180 days to receive it: ${RELAYER%/}/app#wallet"
              fi
              notes="${notes}${line}"$'\n'
            fi
          done
          if [ -n "$notes" ]; then
            printf '%s\n%s' "$notes" "<sub>[MergePay](${RELAYER%/}) · GitHub's OIDC signature verified on-chain on Arc</sub>" \
              | gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file -
          fi
